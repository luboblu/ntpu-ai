# LiteLLM 設定檔（目前先全部走雲端，地端通道已預留、暫未啟用）
#
# 每個級距都可以有多個候選模型 alias，router 後端會讓 judge 在候選裡挑：
#   judge-model  → 專門用來「判斷難度」
#   cloud-small-*  → 難度低時，負責回答的雲端小模型
#   cloud-medium-* → 難度中等時，負責回答的雲端中模型
#   cloud-large-*  → 難度高時，負責回答的雲端大模型
#   local-*        → 地端模型（Ollama / vLLM），alias 以 local- 開頭即會被後端視為地端
#
# 之後要把某個級距新增別的供應商（例如加一個 cloud-small-openai），
# 只要在這裡新增 model_name，並把對應的 *_MODEL_ALIASES 環境變數加上該 alias。

model_list:
  # Judge（難度分類）：Mistral Small 4 —— Mistral 官方對「進階推理分類」情境的
  # 建議模型，比先前的 Gemini 2.5 Flash 便宜（輸入省 50%、輸出省 76%）
  - model_name: judge-model
    litellm_params:
      model: openrouter/mistralai/mistral-small-2603
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-small-claude
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-small-gemini
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: cloud-medium-claude
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-medium-gemini
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: cloud-large-claude
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-large-gemini
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # ── OpenRouter 候選：小 / 中 級距各補一個高 CP 值模型 ──
  # （不採用中國廠商模型，如 DeepSeek，避免資料落地與合規疑慮）
  - model_name: cloud-small-gpt
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-medium-gemma
    litellm_params:
      model: openrouter/google/gemma-4-31b-it
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-medium-llama
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # NVIDIA NIM（API Catalog）：Nemotron Super 49B，支援 tool calling
  - model_name: cloud-medium-nemotron
    litellm_params:
      model: nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1
      api_key: os.environ/NVIDIA_NIM_API_KEY

  # xAI Grok（OpenRouter）：Build 0.1 主打快速 agentic coding、4.3 是一般推理模型，
  # 定價與定位都落在 medium 級距（比其他 medium 候選貴，但遠比 large 旗艦模型便宜）
  - model_name: cloud-medium-grok-build
    litellm_params:
      model: openrouter/x-ai/grok-build-0.1
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-medium-grok43
    litellm_params:
      model: openrouter/x-ai/grok-4.3
      api_key: os.environ/OPENROUTER_API_KEY

  # xAI Grok 旗艦款（OpenRouter）：4.20 主打低幻覺率／強 agentic tool calling，
  # multi-agent 版本專攻深度研究與多代理協作，兩者都對標 large 級距的頂級模型
  - model_name: cloud-large-grok420
    litellm_params:
      model: openrouter/x-ai/grok-4.20
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-large-grok420-agent
    litellm_params:
      model: openrouter/x-ai/grok-4.20-multi-agent
      api_key: os.environ/OPENROUTER_API_KEY

  # ── OpenRouter 免費模型（:free 後綴，零成本，但通常有較嚴格的 rate limit，
  # 且免費層有時會被拿去訓練，正式環境高流量時請留意）──
  - model_name: cloud-small-gpt-oss20
    litellm_params:
      model: openrouter/openai/gpt-oss-20b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-small-gemma-free
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-small-nemotron-nano9
    litellm_params:
      model: openrouter/nvidia/nemotron-nano-9b-v2:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-small-nemotron-nano12vl
    litellm_params:
      model: openrouter/nvidia/nemotron-nano-12b-v2-vl:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-medium-gpt-oss120
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-medium-gemma-free
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-medium-nemotron-nano30
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-30b-a3b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-medium-nemotron-omni
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-large-nemotron-super120
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cloud-large-nemotron-ultra550
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # 範例：如果想讓 small 級距多一個 OpenAI 候選模型，可以加下面這樣
  # 並把 SMALL_MODEL_ALIASES 加上 cloud-small-openai（同時要在環境變數設定 OPENAI_API_KEY）：
  # - model_name: cloud-small-openai
  #   litellm_params:
  #     model: gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

  # ── 地端模型通道（預留，資料隱私需求確定後再啟用）──
  # 啟用步驟：
  #   1. 起 Ollama（或 vLLM）服務，拉好模型
  #   2. 取消下面其中一段註解、改成實際的模型與位址
  #   3. 在 router 後端設定 LOCAL_SMALL_MODEL_ALIASES=local-small-llama（依級距對應）
  #   4. 管理員面板開啟 prefer_local，該級距就會優先走地端
  #
  # - model_name: local-small-llama          # Ollama 範例
  #   litellm_params:
  #     model: ollama_chat/llama3.2
  #     api_base: os.environ/OLLAMA_BASE_URL  # 例如 http://ollama:11434
  #
  # - model_name: local-medium-qwen          # vLLM（OpenAI 相容介面）範例
  #   litellm_params:
  #     model: hosted_vllm/Qwen/Qwen2.5-14B-Instruct
  #     api_base: os.environ/VLLM_BASE_URL    # 例如 http://vllm:8000/v1

general_settings:
  # 金鑰一律由環境變數帶入，不要寫死在設定檔（本機開發可 export LITELLM_MASTER_KEY=sk-1234）
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true     # 不同供應商支援的參數不一樣，多餘的參數直接丟棄而不是報錯
